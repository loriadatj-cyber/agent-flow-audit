name: Agent secret exposure 5
on: workflow_dispatch
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Repository agent evaluation 5
        id: agent
        uses: example/ai-agent@v1
        with:
          prompt: "Review the prepared release notes."
        env:
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
