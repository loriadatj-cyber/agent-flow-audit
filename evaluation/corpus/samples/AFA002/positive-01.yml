name: Agent output shell flow 1
on: workflow_dispatch
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Codex evaluation 1
        id: review
        uses: openai/codex-action@v1
        with:
          prompt: "Return a proposed command."
      - name: Execute model output
        run: "${{ steps.review.outputs.command }}"
