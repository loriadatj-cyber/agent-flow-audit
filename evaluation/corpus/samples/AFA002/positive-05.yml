name: Agent output shell flow 5
on: workflow_dispatch
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Repository agent evaluation 5
        id: review
        uses: example/ai-agent@v1
        with:
          prompt: "Return a proposed command."
      - name: Execute model output
        run: "${{ steps.review.outputs.command }}"
