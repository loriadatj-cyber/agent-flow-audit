name: Agent output artifact flow 3
on: workflow_dispatch
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Gemini evaluation 3
        id: review
        uses: google-github-actions/run-gemini-cli@v1
        with:
          prompt: "Write structured output to result.json."
      - name: Store reviewed output
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-output
          path: result.json
