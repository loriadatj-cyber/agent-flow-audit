name: Agent output artifact flow 5
on: workflow_dispatch
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Repository agent evaluation 5
        id: review
        uses: example/ai-agent@v1
        with:
          prompt: "Write structured output to result.json."
      - name: Store reviewed output
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-output
          path: result.json
