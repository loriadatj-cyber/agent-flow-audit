name: Agent output shell flow 4
on: workflow_dispatch
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Agentic Workflow evaluation 4
        id: review
        uses: github/gh-aw@v1
        with:
          prompt: "Return a proposed command."
      - name: Execute model output
        run: "${{ steps.review.outputs.command }}"
