name: Agent output artifact flow 2
on: workflow_dispatch
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Claude evaluation 2
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          prompt: "Write structured output to result.json."
      - name: Store reviewed output
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-output
          path: result.json
