name: Read-only prompt flow 3
on: pull_request
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Gemini evaluation 3
        id: agent
        uses: google-github-actions/run-gemini-cli@v1
        with:
          prompt: "${{ github.event.pull_request.title }}"
