name: Agent without OIDC 3
on: workflow_dispatch
permissions:
  contents: read
  id-token: none
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Gemini evaluation 3
        id: agent
        uses: google-github-actions/run-gemini-cli@v1
        with:
          prompt: "Review the deployment manifest."
